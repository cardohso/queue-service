name: Nightly property tests
# CI uses a fixed seed (reproducible). This job uses a fresh random seed and more examples
# every night, to keep exploring sequences CI never tries. A failure prints a
# @reproduce_failure blob that replays it exactly.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest tests/test_properties.py --hypothesis-show-statistics
        env:
          HYPOTHESIS_PROFILE: nightly
          QS_HYPOTHESIS_EXAMPLES: "5000"
