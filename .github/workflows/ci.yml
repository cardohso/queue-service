name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration" --hypothesis-show-statistics
        env:
          HYPOTHESIS_PROFILE: ci  # fixed seed: a red build is reproducible
          QS_HYPOTHESIS_EXAMPLES: "1000"

  integration:
    runs-on: ubuntu-latest
    needs: lint-type-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # Testcontainers starts Redis and Postgres itself. Until step 7 adds integration
      # tests, pytest exits 5 (nothing collected); that is the only exit code tolerated.
      - run: uv run pytest -m integration -q || [ $? -eq 5 ]

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
