name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration and not failure" --hypothesis-show-statistics
        env:
          HYPOTHESIS_PROFILE: ci  # fixed seed: a red build is reproducible
          QS_HYPOTHESIS_EXAMPLES: "1000"

  integration:
    runs-on: ubuntu-latest
    needs: lint-type-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # Testcontainers starts Redis and Postgres itself. No exit-code exceptions: if the
      # marker ever selects nothing (pytest exit 5), that is a broken suite and must fail.
      - run: uv run pytest -m integration -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  failure:
    # Real faults: kill -9, Redis restart, Postgres stop/pause/latency, poison, open-loop flood.
    runs-on: ubuntu-latest
    needs: integration
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: docker pull -q ghcr.io/shopify/toxiproxy:2.9.0
      - run: uv run pytest -m failure -s -p no:logging
        env:
          QS_RESULTS_DIR: results
          QS_FLOOD_RATE: "150"  # 4 vCPU runner: still ~2x what the slow worker drains
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-results
          path: results/failures/

  kubernetes:
    # A real kind cluster (3 nodes, Kubernetes v1.36 pinned by digest) on the runner: the same
    # scripts a developer runs locally (deploy/). Smoke test, KEDA scaling, monitoring.
    runs-on: ubuntu-latest
    needs: lint-type-unit
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.33.0
      - run: ./deploy/up.sh
      - name: Smoke test through the Service
        run: ./deploy/smoke.sh
      - run: ./deploy/addons.sh
      - name: KEDA scales workers under backlog; invariant holds
        run: ./deploy/check_scaling.sh
      - name: Prometheus scrapes, every panel has data, alerts fire
        run: ./deploy/check_monitoring.sh
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-qs get nodes,pods -A -o wide || true
          kubectl --context kind-qs -n qs describe pods || true
          kubectl --context kind-qs -n qs logs -l app=worker --tail=50 --all-containers || true
          kubectl --context kind-qs -n qs logs -l app=api --tail=50 || true
          kubectl --context kind-qs -n keda get pods || true
