name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration and not failure" --hypothesis-show-statistics
        env:
          HYPOTHESIS_PROFILE: ci  # fixed seed: a red build is reproducible
          QS_HYPOTHESIS_EXAMPLES: "1000"

  integration:
    runs-on: ubuntu-latest
    needs: lint-type-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # Testcontainers starts Redis and Postgres itself. Until step 7 adds integration
      # tests, pytest exits 5 (nothing collected); that is the only exit code tolerated.
      - run: uv run pytest -m integration -q || [ $? -eq 5 ]

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  failure:
    # Real faults: kill -9, Redis restart, Postgres stop/pause/latency, poison, open-loop flood.
    runs-on: ubuntu-latest
    needs: integration
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: docker pull -q ghcr.io/shopify/toxiproxy:2.9.0
      - run: uv run pytest -m failure -s -p no:logging
        env:
          QS_RESULTS_DIR: results
          QS_FLOOD_RATE: "150"  # 4 vCPU runner: still ~2x what the slow worker drains
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-results
          path: results/failures/
