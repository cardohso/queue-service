# Redis Streams: the dispatch channel, rebuildable from Postgres (DESIGN s2), so no persistent
# volume. A restarted Redis loses its streams and the dispatcher re-publishes from Postgres:
# the failure tests prove exactly that.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: qs
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: qs
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 3
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
