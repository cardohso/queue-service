apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qs
resources:
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: grafana-dashboards
    files: [dashboards/queue-service.json]
generatorOptions:
  disableNameSuffixHash: true   # Grafana mounts it by a fixed name
