# A 3-node local cluster: 1 control plane + 2 workers. Two worker nodes make PodDisruptionBudgets
# and `kubectl drain` meaningful; on one node there is nothing to evict to.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: qs
# Pinned to a Kubernetes version inside KEDA 2.21's tested range (v1.34-v1.36); kind's default
# node image was v1.37, which is newer than anything that KEDA release is tested against.
# The digest makes the cluster reproducible (a tag can move).
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
