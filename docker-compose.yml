# Local dev dependencies. API and worker services are added in steps 3-4.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qs_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-qs}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-qs}"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    # AOF on: Redis restarts keep most data. Correctness does NOT depend on it
    # (Postgres is the source of truth; see docs/DESIGN.md section 2).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
