[project]
name = "queue-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "pebble>=5.2.3",
    "prometheus-client>=0.26.0",
    "pydantic>=2",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
qs = "queue_service.cli:main"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/queue_service"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/failure/*" = ["E501"]  # long inline SQL reads better unwrapped

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs real Redis and Postgres (Docker)",
    "failure: real fault injection with containers and processes (slow)",
]
addopts = "-m 'not failure'"
